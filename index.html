<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="AI 加速器出貨顆數：GPU 與 ASIC 出貨、ASIC 佔比與各家 ASIC 市佔">
<title>AI加速器出貨看板</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
</head>
<body>
<style>
/* 沿用美光看板骨架：單欄卡片、MacroMicro 風格配色（藍柱、紅線） */
:root{
  --bg:#f5f7f9; --card:#ffffff; --fg:#2b3340; --muted:#6b7684; --line:#e3e7ec; --grid:#e6e6e6;
  --bar:#42A9E5; --bar-est:#A9D4F2; --yoy:#FF3333; --qoq:#F5A623;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#141a21; --card:#1c242d; --fg:#e6ebf0; --muted:#9aa5b1; --line:#2c3640; --grid:#2c3640; --bar-est:#7fb6dd; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#141a21; --card:#1c242d; --fg:#e6ebf0; --muted:#9aa5b1; --line:#2c3640; --grid:#2c3640; --bar-est:#7fb6dd; color-scheme:dark }
body{ background:var(--bg); color:var(--fg); font-family:var(--font); padding-block:24px; padding-inline:16px; margin:0 }
.wrap{ max-width:940px; margin:0 auto; display:flex; flex-direction:column; gap:14px }
h1{ font-size:22px; font-weight:700; margin:0; text-wrap:balance }
h1 .tk{ color:var(--muted); font-weight:500; font-size:16px; margin-left:6px }
h2{ font-size:18px; font-weight:700; margin:18px 0 0; text-wrap:balance }
.meta{ color:var(--muted); font-size:13px; margin:0 }
.card{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 8px 6px; min-width:0 }
.note{ color:var(--muted); font-size:12.5px; line-height:1.6; margin:0; padding-inline:4px }
.note b{ color:var(--fg); font-weight:500 }
.seg{ display:flex; gap:4px; margin:0 0 4px 6px }
.seg button{ font:inherit; font-size:12px; border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:4px; padding:3px 9px; cursor:pointer }
.seg button[aria-pressed="true"]{ background:#3bbd8f; border-color:#3bbd8f; color:#fff }
.seg button:focus-visible{ outline:2px solid var(--bar); outline-offset:1px }
.tabs{ display:flex; gap:4px; flex-wrap:wrap }
.tabs a{ font-size:13px; border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:4px; padding:4px 11px; text-decoration:none }
.tabs a[aria-current="page"]{ background:#3bbd8f; border-color:#3bbd8f; color:#fff }
.tabs a:focus-visible{ outline:2px solid var(--bar); outline-offset:1px }
#chart1{ width:100%; height:480px }
.tbl-wrap{ overflow-x:auto; padding:8px 10px }
table.num{ border-collapse:collapse; width:100%; font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap }
table.num th, table.num td{ padding:5px 10px; text-align:right; border-bottom:1px solid var(--line) }
table.num th:first-child, table.num td:first-child{ text-align:left; position:sticky; left:0; background:var(--card) }
table.num thead th{ color:var(--muted); font-weight:500 }
table.num tr.grp td{ color:var(--muted); font-size:12px; font-weight:500; padding-top:14px; border-bottom:none }
table.num tr.sub td{ font-weight:700 }
table.num tr.child td{ color:var(--muted); font-size:12px }
table.num tr.tot td{ font-weight:700; border-bottom:2px solid var(--line) }
table.num td.adj{ font-weight:700; background:rgba(66,169,229,.14) }
table.num tr.child td:first-child{ padding-left:22px }
@media (max-width:480px){ #chart1{ height:420px } h1{ font-size:19px } }
</style>

<div class="wrap">
  <nav class="tabs" aria-label="頁面">
    <a href="index.html" aria-current="page">出貨顆數</a>
    <a href="asic.html">ASIC 代數與時程</a>
  </nav>
  <h1>AI 加速器出貨：GPU vs ASIC<span class="tk">萬顆</span></h1>
  <p class="meta">年度出貨顆數（萬顆）與 ASIC 佔比。點圖例可開關各序列；上方切換修正前／修正版。</p>

  <h2>GPU 與 ASIC 出貨顆數、ASIC 佔比</h2>
  <div class="card">
    <div class="seg" role="group" aria-label="資料版本">
      <button type="button" id="segAdj" aria-pressed="true">修正版</button>
      <button type="button" id="segOrig" aria-pressed="false">修正前</button>
    </div>
    <div id="chart1"></div>
  </div>
  <p class="note">
    <b>資料：</b>綜合券商報告（2026/9），單位換算為萬顆。
  </p>
  <p class="note">[註]: Anthropic 繼 2026 年 1GW Ironwood 後，2027 年再部署 5GW TPU v8i，2028 年再增加 10GW；OpenAI Jalapeño 2027 年部署 1.3GW、2028 年逾 5GW（博通26Q2法說會）。</p>

  <h2>數值參考</h2>
  <div class="card tbl-wrap"><table class="num" id="tbl"></table></div>
  <p class="note">單位：萬顆；隨上方「修正版／修正前」切換。<span id="tblNote"></span></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.4.8/highcharts.js"></script>
<script>
(function(){
  var YRS=["2023","2024","2025","2026E","2027E","2028E"];
  // 萬顆；修正前（綜合券商報告）
  var ORIG={
    NVIDIA:[170,450,620,890,1000,1160], AMD:[10,50,70,70,150,230],
    Google:[120,170,180,440,890,1160], AWS:[30,80,150,190,350,350],
    Meta:[0,0,0,30,50,110], MSFT:[0,0,0,20,80,80], OpenAI:[0,0,0,0,0,0]
  };
  // 修正版：只改有博通法說會依據的格子
  var ADJ=JSON.parse(JSON.stringify(ORIG));
  ADJ.Google[5]=1235;              // Anthropic 10GW÷1.5kW≈667 ＋ Google 自用 473×1.2≈568
  ADJ.OpenAI=[0,0,0,0,74,286];     // 1.3GW、5GW ÷1.75kW
  // 原表以 0.1 百萬顆為最小單位、2023–2025 四捨五入成 0 的格子，改用另一家券商的千顆級數字
  // （Meta 該券商估 20/12/10 萬，超過四捨五入門檻，屬兩家估值分歧而非單位問題，暫不採用）
  ADJ.MSFT[0]=1.2; ADJ.MSFT[1]=2.2; ADJ.MSFT[2]=0;
  var GPU=["NVIDIA","AMD"], ASIC=["Google","AWS","Meta","MSFT","OpenAI"];
  var NAME={NVIDIA:"NVIDIA GPU",AMD:"AMD GPU",Google:"Google TPU",AWS:"AWS Trainium",Meta:"Meta MTIA",MSFT:"MSFT Maia",OpenAI:"OpenAI XPU"};
  var GR_GPU="#3949AB", GR_ASIC="#E91E63";   // 增速線（避開柱色）
  var COL={NVIDIA:"#1F5FA8",AMD:"#7FB3E0",Google:"#16A085",AWS:"#F39C12",Meta:"#8E44AD",MSFT:"#5D6D7E",OpenAI:"#C0392B"};
  // 修正版 Google TPU 中 Anthropic 部分（1GW÷1.2kW、5GW÷1.2kW、10GW÷1.5kW）
  var ANTH=[null,null,null,83,417,667];
  var mode="adj", chart1, grVisible=false;   // 增速線開關狀態（切換版本時保留）

  /* ---------- 數值參考表 ---------- */
  function buildTable(){
    var d=mode==="adj"?ADJ:ORIG, n=YRS.length;
    function f(v){ return v==null?"—":Highcharts.numberFormat(v,v%1?1:0); }
    var HL={OpenAI:1};   // 整列藍底：GW 換算的新增列
    var G=YRS.map(function(_,i){ return sum(d,GPU,i); }), A=YRS.map(function(_,i){ return sum(d,ASIC,i); });
    var T=G.map(function(g,i){ return g+A[i]; });
    var h='<thead><tr><th>萬顆</th>'+YRS.map(function(y){ return "<th>"+y+"</th>"; }).join("")+"</tr></thead><tbody>";
    function row(label,cells,cls){ return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+label+"</td>"+cells.join("")+"</tr>"; }
    function vend(k){ return row(NAME[k], d[k].map(function(v,i){ return '<td'+(HL[k]?' class="adj"':'')+'>'+f(v)+"</td>"; })); }
    function plain(arr,cls){ return arr.map(function(v){ return "<td"+(cls?' class="'+cls+'"':"")+">"+v+"</td>"; }); }
    function grp(t){ return '<tr class="grp"><td colspan="'+(n+1)+'">'+t+"</td></tr>"; }
    h+=grp("出貨顆數");
    GPU.forEach(function(k){ h+=vend(k); });
    h+=row("GPU 小計",plain(G.map(f)),"sub");
    ASIC.forEach(function(k){
      if(mode==="orig" && k==="OpenAI") return;
      h+=vend(k);
      if(k==="Google" && mode==="adj") h+=row("其中 Anthropic",plain(ANTH.map(function(v){ return v==null?"—":"~"+f(v); }),"adj"),"child");
    });
    h+=row("ASIC 小計",plain(A.map(f)),"sub");
    h+=row("合計",plain(T.map(f)),"tot");
    document.getElementById("tbl").innerHTML=h+"</tbody>";
    document.getElementById("tblNote").textContent=mode==="adj"?"藍底＝依博通法說會 GW 換算的估計；Anthropic 已含於 Google TPU，OpenAI 為新增列。":"";
  }

  function tok(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function sum(d,keys,i){ return keys.reduce(function(s,k){ return s+d[k][i]; },0); }

  function build1(){
    var fg=tok("--fg"), muted=tok("--muted"), grid=tok("--grid"), card=tok("--card"), font=tok("--font"), red=tok("--yoy");
    var d=mode==="adj"?ADJ:ORIG;
    var share=YRS.map(function(_,i){ var a=sum(d,ASIC,i), g=sum(d,GPU,i); return +((a/(a+g))*100).toFixed(1); });
    var series=[];
    GPU.concat(ASIC).forEach(function(k){
      if(mode==="orig" && k==="OpenAI") return;
      series.push({ name:NAME[k], type:"column", color:COL[k], stack:GPU.indexOf(k)>=0?"GPU":"ASIC", data:d[k], yAxis:0 });
    });
    series.push({ name:"ASIC 佔比(R)", type:"line", color:red, data:share, yAxis:1,
      zoneAxis:"x", zones:[{value:2.5},{dashStyle:"ShortDash"}] });
    // GPU／ASIC 顆數年增率：同一個圖例開關控制兩條線，預設關閉
    function gr(arr){ return arr.map(function(v,i){ return i&&arr[i-1]?Math.round((v/arr[i-1]-1)*100):null; }); }
    var Gs=YRS.map(function(_,i){ return sum(d,GPU,i); }), As=YRS.map(function(_,i){ return sum(d,ASIC,i); });
    var grEv={ legendItemClick:function(){ grVisible=!this.visible; } };
    series.push({ id:"gr", name:"GPU／ASIC 增速(R)", type:"line", color:GR_GPU, data:gr(Gs), yAxis:2, visible:grVisible, grName:"GPU 增速",
      marker:{symbol:"square"}, zoneAxis:"x", zones:[{value:2.5},{dashStyle:"ShortDash"}], events:grEv });
    series.push({ linkedTo:"gr", name:"ASIC 增速", type:"line", color:GR_ASIC, data:gr(As), yAxis:2, visible:grVisible, grName:"ASIC 增速",
      marker:{symbol:"diamond"}, zoneAxis:"x", zones:[{value:2.5},{dashStyle:"ShortDash"}] });
    var opts={
      chart:{ backgroundColor:card, style:{fontFamily:font}, spacing:[10,16,8,8] },
      title:{ text:"GPU vs ASIC 出貨顆數", style:{color:fg,fontSize:"15px",fontWeight:"700"} },
      subtitle:{ text:mode==="adj"?"綜合券商報告＋博通法說會修正":"綜合券商報告（修正前）", style:{color:muted,fontSize:"11px"} },
      credits:{ enabled:false },
      legend:{ enabled:true, align:"center", verticalAlign:"bottom", itemStyle:{color:fg,fontSize:"12px",fontWeight:"400"},
        itemHiddenStyle:{color:"#9aa5b1"}, itemHoverStyle:{color:fg}, symbolRadius:6 },
      xAxis:{ categories:YRS, lineColor:grid, tickColor:grid, labels:{style:{color:muted,fontSize:"11px"}},
        plotBands:[{ from:2.5, to:5.5, color:"rgba(150,160,170,0.08)", label:{ text:"預估", style:{color:muted,fontSize:"11px"} } }] },
      yAxis:[
        { title:{text:"萬顆",style:{color:muted,fontSize:"11px"}}, gridLineColor:grid, min:0, stackLabels:{enabled:false},
          labels:{ style:{color:muted,fontSize:"11px"}, formatter:function(){ return Highcharts.numberFormat(this.value,0); } } },
        { title:{text:"ASIC 佔比 %",style:{color:muted,fontSize:"11px"}}, opposite:true, gridLineWidth:0, min:0, max:100,
          labels:{ style:{color:muted,fontSize:"11px"}, format:"{value}%" } },
        { title:{text:"年增率 %",style:{color:muted,fontSize:"11px"}}, opposite:true, gridLineWidth:0, showEmpty:false,
          labels:{ style:{color:muted,fontSize:"11px"}, format:"{value}%" } }
      ],
      tooltip:{ shared:true, useHTML:true, outside:true, backgroundColor:card, borderColor:grid, style:{color:fg,fontSize:"12px"},
        // 提示框固定放在該年柱子（含佔比點）正上方，不遮柱；outside 讓它可超出圖框往上長
        positioner:function(w,h,pt){
          var c=this.chart, i=Math.round(c.xAxis[0].toValue(pt.plotX,true)), top=c.plotHeight;
          c.series.forEach(function(s){ var p=s.visible&&s.points[i]; if(p&&p.plotY!=null) top=Math.min(top,p.plotY); });
          var x=c.plotLeft+c.xAxis[0].toPixels(i,true)-w/2;
          return { x:Math.max(0,Math.min(x,c.chartWidth-w)), y:c.plotTop+top-h-10 };
        },
        formatter:function(){
          var i=this.points[0].point.index, g=sum(d,GPU,i), a=sum(d,ASIC,i), shr=null, gp=[], ap=[], gg={};
          function f(v){ return Highcharts.numberFormat(v,v%1?1:0); }
          this.points.forEach(function(p){
            if(p.series.options.yAxis===1){ shr=p.y; return; }
            if(p.series.options.yAxis===2){ gg[p.series.options.grName]='<b style="color:'+p.color+'">'+(p.y>0?"+":"")+p.y+'%</b>'; return; }
            (p.series.options.stack==="GPU"?gp:ap).push('<span style="color:'+p.color+'">●</span> '+p.series.name+' <b>'+f(p.y)+'</b>'); });
          var rows=Math.max(gp.length,ap.length), t='<table style="border-collapse:collapse;line-height:1.45">';
          t+='<tr><td colspan="2"><b>'+YRS[i]+'</b>'+(shr!=null?'　ASIC 佔比 <b style="color:'+red+'">'+shr+'%</b>':'')+'</td></tr>';
          for(var r=0;r<rows;r++) t+='<tr><td style="padding-right:14px">'+(gp[r]||"")+'</td><td>'+(ap[r]||"")+'</td></tr>';
          t+='<tr style="color:'+muted+'"><td style="padding-right:14px">GPU 小計 '+f(g)+' 萬'+(gg["GPU 增速"]?'（'+gg["GPU 增速"]+'）':'')+'</td><td>ASIC 小計 '+f(a)+' 萬'+(gg["ASIC 增速"]?'（'+gg["ASIC 增速"]+'）':'')+'</td></tr>';
          return t+'</table>'; } },
      plotOptions:{
        column:{ stacking:"normal", borderWidth:0, pointPadding:0.06, groupPadding:0.16 },
        line:{ lineWidth:2, marker:{enabled:true,symbol:"circle",radius:3} },
        series:{ states:{inactive:{opacity:1}} }
      },
      series:series
    };
    if(chart1){ chart1.destroy(); }
    chart1=Highcharts.chart("chart1",opts);
  }

  function setMode(m){
    mode=m;
    document.getElementById("segAdj").setAttribute("aria-pressed",m==="adj");
    document.getElementById("segOrig").setAttribute("aria-pressed",m==="orig");
    build1(); buildTable();
  }
  document.getElementById("segAdj").addEventListener("click",function(){ setMode("adj"); });
  document.getElementById("segOrig").addEventListener("click",function(){ setMode("orig"); });

  function build(){ build1(); buildTable(); }
  Highcharts.setOptions({ lang:{ thousandsSep:"," } });
  build();
  var mq=window.matchMedia("(prefers-color-scheme: dark)");
  if(mq.addEventListener) mq.addEventListener("change",build);
  new MutationObserver(build).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
})();
</script>
</body>
</html>
